name: 🤖 Generador Nocturno de Pronósticos

on:
  schedule:
    # 03:00 UTC equivale a las 11:00 PM Hora Venezuela (UTC-4)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub si hace falta

permissions:
  contents: write

jobs:
  generar-pronosticos:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar dependencias
        run: |
          mkdir -p scripts
          cd scripts
          echo '{"dependencies":{"node-fetch":"^3.3.2"}}' > package.json
          npm install

      - name: 🔍 1. Obtener resultados del día y rotar historial
        run: node scripts/obtener_de_api.js

      - name: 🔄 2. Generar secuencias y Super Fijos para mañana
        run: |
          node scripts/actualizar_secuencia.js
          node scripts/actualizar_secuencia_granja.js
          node scripts/actualizar_secuencia_granjita.js
          node scripts/actualizar_secuencia_selva.js

      - name: 📤 3. Publicar actualización en GitHub Pages
        run: |
          git config --global user.name "Dr. Animalitos Bot"
          git config --global user.email "bot@tuanimalito.github.io"
          git add data/*.json
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Pronósticos actualizados para mañana $(date +'%d/%m/%Y')"
          git push
