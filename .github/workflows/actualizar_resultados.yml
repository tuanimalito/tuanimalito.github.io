name: 🤖 Actualización Automática de Resultados

on:
  schedule:
    - cron: '0 3 * * *'  # 11:00 PM hora Venezuela (3:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar dependencias
        run: |
          mkdir -p scripts
          cd scripts
          echo '{"dependencies":{"node-fetch":"^3.3.2"}}' > package.json
          npm install

      - name: 🔍 Obtener resultados de la API
        id: obtener
        run: node scripts/obtener_de_api.js
        continue-on-error: true

      - name: 🔄 Actualizar secuencia.json (Lotto Activo)
        if: success()
        run: node scripts/actualizar_secuencia.js
        continue-on-error: true

      - name: 🔄 Actualizar secuencia_granja.json (Granja Millonaria)
        if: success()
        run: node scripts/actualizar_secuencia_granja.js
        continue-on-error: true

      - name: 🔄 Actualizar secuencia_granjita.json (La Granjita)
        if: success()
        run: node scripts/actualizar_secuencia_granjita.js
        continue-on-error: true

      - name: 🔄 Actualizar secuencia_selva.json (Selva Plus)
        if: success()
        run: node scripts/actualizar_secuencia_selva.js
        continue-on-error: true

      - name: 📤 Commit y push de todos los cambios
        run: |
          git config --global user.name "Dr. Animalitos Bot"
          git config --global user.email "bot@tuanimalito.github.io"
          git add data/*.json
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Actualización automática $(date +'%d/%m/%Y')"
          git push
